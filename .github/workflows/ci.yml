name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build + vet + full suite (boots throwaway PostgreSQL via testcontainers).
      - name: Verify
        run: make verify

      # -race needs CGO; ubuntu runners ship gcc. Ryuk disabled:
      # testcontainers-go v0.44.0 has a library-internal reaper startup
      # race that -race can flag; tests clean up their own containers.
      - name: Race detector
        run: make race
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
